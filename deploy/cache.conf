# Cache policy for welcometomimoland.com — nginx.
#
# public/_headers is the same policy in Cloudflare Pages / Netlify syntax, and
# is what the repo would use on those hosts. This site serves from nginx behind
# the Cloudflare proxy, which never reads that file, so the policy has to live
# here as well. Keep the two in step.
#
# Measured before this existed: every static asset came back with
# `Cache-Control: max-age=14400` and the HTML with no Cache-Control header at
# all, so ~2.7 MB was refetched on a schedule and the HTML was left to
# heuristic caching — which is what lets a browser hold a stale page for hours
# after a deploy.
#
# Include from the server block:
#     include /path/to/cache.conf;

# Content-hashed by the build. The filename changes when the bytes change, so
# these can never go stale.
location ^~ /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Rendition width is part of the filename, so the same rule applies.
location ^~ /images/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# The hero loop is the largest asset on the site by an order of magnitude;
# a repeat visitor refetching it is the most expensive cache miss available.
location ^~ /video/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# The email lockup. Not content-hashed, and mail already delivered points at
# this URL forever, so `immutable` would pin an old logo into every mail
# client's cache. A week is long enough to stop refetching on each open.
location ^~ /email/ {
    add_header Cache-Control "public, max-age=604800" always;
}

# HTML revalidates on every view so a deploy is picked up immediately. Without
# an explicit header here browsers apply heuristic caching from Last-Modified,
# which is how a visitor ends up on yesterday's build.
location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}

location = / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
}
