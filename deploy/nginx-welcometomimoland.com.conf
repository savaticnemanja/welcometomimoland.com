# welcometomimoland.com — host nginx, terminating TLS and joining two
# containers back into one origin:
#
#   /api/contact  → 127.0.0.1:8089   the Node contact handler
#   everything    → 127.0.0.1:8088   nginx serving the static export
#
# It serves no files of its own: the site lives inside the image, so a deploy
# is one `docker compose up` and there is no directory on the host that can
# drift out of step with it. This replaces the previous
# `root /var/www/welcometomimoland.com` static vhost.
#
# The cache policy is NOT here. It ships inside the image (deploy/cache.conf,
# included by the container nginx), so a push that changes it takes effect on
# the next deploy with no host-side edit.
#
# The certificate is the vidika.co one — a single Certbot lineage covers both
# names. The port-80 and Certbot blocks below are carried over untouched for
# that reason: renewal affects both sites.

server {
    server_name welcometomimoland.com;

    # Behind the Cloudflare proxy, so $remote_addr is an edge IP without this.
    # Nothing here rate-limits, so this only buys correct access logs — but a
    # log full of Cloudflare addresses is a log that cannot answer questions.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # add_header replaces the inherited set rather than adding to it, so the
    # four from conf.d/security-headers.conf are repeated here alongside the
    # additions. No location below sets a header, so all responses inherit it.
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # The hero loop is the largest asset on the site; let it stream rather than
    # buffering the whole file before the first byte reaches the visitor.
    proxy_buffering on;

    location = /healthz {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        access_log off;
    }

    # The deck form. A different container from everything else on this vhost:
    # the site is static files out of nginx on :8088, and this one route is the
    # Node handler on :8089. Throttled harder than the rest of the site, and
    # separately, so a burst of page views can never use up the budget that
    # protects mail. burst=5 nodelay lets a genuine double-click through and
    # queues nothing.
    location = /api/contact {
        limit_req zone=mimoland_contact burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A submission is a single small POST; buffering it whole means the
        # Node process is never held open by a slow client.
        proxy_request_buffering on;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The container sets Cache-Control per path — a year and immutable for
        # /_next/static/, /images/ and /video/, revalidate for HTML. Nothing
        # here overrides it, so that policy reaches the browser intact.
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/vidika.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vidika.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name welcometomimoland.nemanjas.dev;

    return 301 https://$host$request_uri;
}

# Port 80 for the apex domain. Without this the ACME challenge for
# welcometomimoland.com falls through to the default_server in
# sites-available/default and certbot generates a block there instead. The
# redirect lives in `location /` rather than at server level: a server-level
# `return` runs in the rewrite phase, before location matching, and would
# swallow the challenge request.
server {
    if ($host = welcometomimoland.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name welcometomimoland.com;

    location /.well-known/acme-challenge/ {
        root /var/www/welcometomimoland.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
