# nginx inside the image. The host nginx terminates TLS and proxies here; this
# one only serves files out of the static export.
#
# Written to /etc/nginx/conf.d/default.conf by the Dockerfile, replacing the
# stock one. cache.conf goes to /etc/nginx/snippets/ instead of conf.d/,
# because the base image auto-includes conf.d/*.conf at http{} level and the
# location blocks in it are only legal inside a server{}.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # trailingSlash: true means nginx answers /privacy-notice with a 301 to
    # /privacy-notice/. Left absolute, that Location is rebuilt from the
    # proxied request as http://$host/... — so an HTTPS visitor is bounced
    # through plaintext and back. Relative redirects keep whatever scheme and
    # host the visitor actually used.
    absolute_redirect off;

    # next.config.ts sets trailingSlash: true, so the export emits
    # /privacy-notice/index.html rather than /privacy-notice.html. $uri/ picks
    # up the directory form; $uri.html covers anything flat.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # The cache policy travels with the image, so a push that changes it takes
    # effect on the next deploy with no host-side edit. public/_headers is the
    # same policy in Cloudflare Pages syntax — keep the two in step.
    include /etc/nginx/snippets/cache.conf;

    # The export ships a styled 404.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Liveness for the healthcheck and any uptime probe. Answered here rather
    # than by a file so it cannot 404 if the export layout changes.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 "{\"ok\":true}\n";
    }

    # Compression is done by the host nginx on the way out (gzip_proxied any),
    # so doing it again here would only burn CPU on a loopback hop.
    gzip off;
}
