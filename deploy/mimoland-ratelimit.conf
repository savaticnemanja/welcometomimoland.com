# limit_req_zone must live in http{} context, which sites-available/ is not.
# nginx.conf includes conf.d/*.conf inside http{}, so this is the least
# invasive place to declare it — no edit to nginx.conf itself.
#
# Consumed by `limit_req zone=mimoland_contact` in
# sites-available/welcometomimoland.com. Without this file nginx refuses to
# start and the error names that vhost.
#
# 10r/m against the real visitor IP (see cloudflare-realip.conf — the key is
# only meaningful because that snippet restores $binary_remote_addr).
limit_req_zone $binary_remote_addr zone=mimoland_contact:10m rate=10r/m;
