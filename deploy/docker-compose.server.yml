# welcometomimoland.com — two containers, behind host nginx.
#
#   app  127.0.0.1:8088  nginx serving the static export
#   api  127.0.0.1:8089  the contact handler, POST /api/contact only
#
# They are separate on purpose. The site is a Next.js static export and needs
# no runtime at all; the handler is the one route that cannot be a file. Split
# this way, the site stays up whether or not the mail path is healthy, and
# neither container needs a process supervisor to hold two daemons.
#
# The host nginx is what joins them back into one origin: everything goes to
# app, and /api/contact goes to api. See deploy/nginx-welcometomimoland.com.conf.
#
# No volumes: nothing is written by either. Destroying and recreating loses
# nothing, which is what makes `up -d --force-recreate` a safe deploy.

name: welcometomimoland
services:
  app:
    build:
      context: ./src
      target: runner
    image: welcometomimoland-app:local
    container_name: welcometomimoland-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    # The 127.0.0.1 prefix is the single most important line in this file.
    # Without it Docker publishes on 0.0.0.0 and — because it writes its own
    # iptables rules, below the firewall — the port is reachable from the
    # internet even when UFW says it is closed. Bound to loopback, only nginx
    # can reach it.
    ports:
      - "127.0.0.1:8088:80"

    # nginx serving a few hundred static files needs very little. The ceiling
    # is here so a runaway cannot take down the other containers — or sshd.
    mem_limit: 128m
    cpus: "1.0"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./src
      target: api
    image: welcometomimoland-api:local
    container_name: welcometomimoland-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    ports:
      - "127.0.0.1:8089:8787"

    # Mail credentials. Everything optional defaults to the values in
    # server/config.mjs, so a .env holding only the API key is a complete
    # config. Mode 0640 nemanjas:developers — the deploy hook runs as `deploy`
    # and compose cannot read a 0600 file.
    env_file: .env

    environment:
      NODE_ENV: production

      # `:?` rather than a default: with no key the handler would fall back to
      # printing enquiries instead of sending them, which is a production box
      # silently swallowing deck requests. Better to refuse to start.
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in /srv/welcometomimoland.com/.env}

      # www has no DNS record, so listing it would allowlist an origin that
      # cannot exist.
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://welcometomimoland.com}"

    # One JSON route needs even less than the static server does.
    mem_limit: 128m
    cpus: "0.5"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
